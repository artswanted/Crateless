name: Release

on:
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: windows-2022
    steps:
    - uses: actions/checkout@v7
    - name: Setup dotnet
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'

    - name: Check tag matches version
      if: github.event_name == 'release'
      run: |
        $version = ([xml](Get-Content app/GHelper.csproj)).Project.PropertyGroup.AssemblyVersion
        $tag = "${{ github.event.release.tag_name }}"
        if ($tag -ne "v$version") { throw "Tag $tag does not match AssemblyVersion $version" }

    - name: Publish (framework-dependent)
      run: |
        dotnet publish app/GHelper.sln --configuration Release --runtime win-x64 -p:PublishSingleFile=true --no-self-contained
        Copy-Item app/bin/x64/Release/net10.0-windows/win-x64/publish/Crateless.exe ./Crateless.exe

    - name: Publish (self-contained)
      run: |
        dotnet publish app/GHelper.sln --configuration Release --runtime win-x64 -p:PublishSingleFile=true --self-contained true -p:PublishDir=bin/publish-sc/
        Copy-Item app/bin/publish-sc/Crateless.exe ./Crateless-standalone.exe

    - name: Create ZIPs
      run: |
        Compress-Archive ./Crateless.exe ./Crateless.zip
        Compress-Archive ./Crateless-standalone.exe ./Crateless-standalone.zip

    # Builds are not code-signed: the fork has no SignPath secrets.
    # SmartScreen will warn on first launch. See docs/crateless/PLAN.md §6.
    - name: Upload workflow artifacts
      uses: actions/upload-artifact@v7
      with:
        name: Crateless
        path: |
          ./Crateless.exe
          ./Crateless-standalone.exe

    - name: Upload release assets
      if: github.event_name == 'release'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release upload "${{ github.event.release.tag_name }}" ./Crateless.exe ./Crateless.zip ./Crateless-standalone.exe ./Crateless-standalone.zip --clobber

    - name: Generate SLSA build provenance attestation
      uses: actions/attest-build-provenance@v4
      with:
        subject-path: |
          ./Crateless.exe
          ./Crateless.zip
          ./Crateless-standalone.exe
          ./Crateless-standalone.zip
